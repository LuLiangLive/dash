[pytest]
# 测试路径
testpaths = tests

# 测试文件匹配
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# 标记（tags）- 用于选择性运行测试
markers =
    smoke: 冒烟测试 - 核心功能快速验证
    regression: 回归测试 - 完整功能验证
    contract: API契约测试 - 前后端数据格式验证
    performance: 性能测试 - 算法性能验证
    integration: 集成测试 - 模块间交互验证
    unit: 单元测试 - 单个函数/模块验证
    alert: 提醒模块测试
    portfolio: 持仓模块测试
    ranking: 榜单模块测试
    watchlist: 自选模块测试
    fund: 基金详情模块测试
    slow: 慢速测试 - 需要网络/较长运行时间

# 禁用警告
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

# 输出格式
addopts =
    -v
    --tb=short
    --strict-markers
    -m "not slow"

# 并行执行（需要pytest-xdist）
# addopts = -n auto
