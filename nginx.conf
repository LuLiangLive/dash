# nginx.conf —— 反向代理示例
# API 服务与网页静态文件同域托管:
#   http://your.domain/            → 静态 index.html(由 FastAPI 返回)
#   http://your.domain/api/*       → FastAPI 反向代理
#   /static/* 由 FastAPI 直接托管(已挂载),无需 nginx 单独配置静态目录。

# 若只想用 nginx 托管前端静态文件(static/ 目录),可去掉注释:
# server {
#     listen 80;
#     server_name your.domain;

#     # 方式 A: 静态文件直接由 nginx 托管(推荐生产)
#     location / {
#         root /opt/invest-dashboard/static;
#         try_files $uri $uri/ /index.html;
#     }
#     location /api/ {
#         proxy_pass http://127.0.0.1:8002;
#         proxy_set_header Host $host;
#         proxy_set_header X-Real-IP $remote_addr;
#         proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
#     }
# }

# 方式 B: 全部交给 FastAPI(静态 + API 同源,最少配置)
server {
    listen 80;
    server_name your.domain;

    location / {
        proxy_pass http://127.0.0.1:8002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
